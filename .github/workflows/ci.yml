name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository and never deploys.
permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `next build` evaluates the server configuration in production mode, so the
    # build requires production-shaped values. These are non-secret build-time
    # placeholders: CI never deploys them, and runtime configuration comes from
    # the deployment environment.
    env:
      APP_URL: https://dramascan.example.com
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dramascan
      BETTER_AUTH_SECRET: ci-build-only-secret-with-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-build-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-build-only-google-client-secret
      SUPER_ADMIN_EMAIL: ci-build@example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly from package-lock.json and fails when the
      # lockfile and package.json are out of sync.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dramascan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dramascan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Isolated, disposable database for this CI run only. The name must end
      # in _test; tests/global-setup.ts rejects other names.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dramascan_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Integration tests
        run: npm run test:integration -- --passWithNoTests
